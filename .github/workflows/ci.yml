name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package itself (declared deps incl. sqlite-vec) instead of
          # a hand-rolled list — a hand list silently drifts when pyproject gains
          # a dependency (this exact gap broke backend CI after semantic search
          # landed). Tests exercise the packaged console entry point too.
          pip install -e .
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # match the lockfile/dev environment (pnpm-workspace.yaml uses
          # pnpm 10+ `allowBuilds`; pnpm 9 rejects the file without `packages`)
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (uses the node:sqlite builtin)
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
